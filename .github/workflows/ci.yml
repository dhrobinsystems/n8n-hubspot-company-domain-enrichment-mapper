name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Zero npm dependencies: nothing to install.
      - name: Build, lint, secret scan, tests and harness (CI mode)
        run: bash build.sh --check

      - name: Confirm a fresh build leaves no diff
        run: |
          node scripts/build-workflow.js
          git diff --exit-code -- workflow.json
